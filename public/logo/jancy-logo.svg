<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055A5" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Architectural Emblem: Modern Monogram combining J and B with structural cantilever -->
  <g transform="translate(10, 10)">
    <!-- Structural Blueprint Lines -->
    <path d="M 10 75 L 10 10 L 45 10" stroke="url(#beamGrad)" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6" />
    
    <!-- Foundation Slab -->
    <rect x="5" y="72" width="70" height="6" rx="2" fill="url(#goldGrad)" />
    
    <!-- Left Pillar (Letter J curve into foundation) -->
    <path d="M 22 20 L 22 60 Q 22 72 12 72 L 8 72" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
    
    <!-- Main Tower & Cantilever (Letter B architectural form) -->
    <path d="M 32 15 L 32 72 M 32 18 L 54 18 C 65 18 68 28 60 36 C 56 40 48 42 32 42 M 32 42 L 58 42 C 70 42 74 54 64 64 C 58 70 48 72 32 72" 
          stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <!-- Dynamic Cantilever Horizon Beam -->
    <line x1="20" y1="42" x2="75" y2="42" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8" />

    <!-- Corner Keystone accent -->
    <polygon points="32,15 38,15 32,21" fill="#FFF2B2" />
  </g>

  <!-- Typography -->
  <g transform="translate(95, 12)">
    <!-- Company Name -->
    <text x="0" y="38" font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', Georgia, serif" font-size="34" font-weight="800" letter-spacing="4" fill="url(#goldGrad)" filter="url(#glow)">
      JANCY
    </text>
    <text x="145" y="38" font-family="'Cinzel', 'Trajan Pro', 'Playfair Display', Georgia, serif" font-size="34" font-weight="300" letter-spacing="4" fill="#FFFFFF">
      BUILDERS
    </text>
    
    <!-- Architectural Divider Line -->
    <line x1="0" y1="52" x2="310" y2="52" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
    <circle cx="155" cy="52" r="3" fill="#D4AF37" />

    <!-- Tagline -->
    <text x="0" y="69" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#94A3B8">
      BUILD THE WORLD
    </text>
  </g>
</svg>
